services:
  api:
    environment:
      PAYMENT_PROVIDER: robokassa
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:?ROBOKASSA_MERCHANT_LOGIN is required}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1:?ROBOKASSA_PASSWORD1 is required}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2:?ROBOKASSA_PASSWORD2 is required}
      ROBOKASSA_PASSWORD3: ${ROBOKASSA_PASSWORD3:?ROBOKASSA_PASSWORD3 is required for refunds}
      ROBOKASSA_TEST_PASSWORD1: ${ROBOKASSA_TEST_PASSWORD1:-}
      ROBOKASSA_TEST_PASSWORD2: ${ROBOKASSA_TEST_PASSWORD2:-}
      ROBOKASSA_TEST_MODE: ${ROBOKASSA_TEST_MODE:-false}
      ROBOKASSA_HASH_ALGORITHM: ${ROBOKASSA_HASH_ALGORITHM:-sha256}
      ROBOKASSA_REFUND_HASH_ALGORITHM: ${ROBOKASSA_REFUND_HASH_ALGORITHM:-sha256}
      ROBOKASSA_TAX: ${ROBOKASSA_TAX:-none}
      ROBOKASSA_PAYMENT_METHOD: ${ROBOKASSA_PAYMENT_METHOD:-full_prepayment}
      ROBOKASSA_PAYMENT_OBJECT: ${ROBOKASSA_PAYMENT_OBJECT:-service}
      ROBOKASSA_SNO: ${ROBOKASSA_SNO:?ROBOKASSA_SNO is required for fiscal receipts}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL is required for fiscal receipts}
      FISCAL_RECEIPT_WORKER_ENABLED: "true"
      FISCAL_RECEIPT_POLL_INTERVAL_MS: ${FISCAL_RECEIPT_POLL_INTERVAL_MS:-15000}
      FISCAL_RECEIPT_BATCH_SIZE: ${FISCAL_RECEIPT_BATCH_SIZE:-5}
      FISCAL_RECEIPT_MAX_ATTEMPTS: ${FISCAL_RECEIPT_MAX_ATTEMPTS:-8}
      FISCAL_RECEIPT_CLAIM_TTL_SECONDS: ${FISCAL_RECEIPT_CLAIM_TTL_SECONDS:-120}
      NOTIFICATION_EMAIL_PROVIDER: smtp
      NOTIFICATION_DELIVERY_WORKER_ENABLED: "true"
      SMTP_URL: ${SMTP_URL:?SMTP_URL is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}

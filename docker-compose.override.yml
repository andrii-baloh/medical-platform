services:
  api:
    image: medicare/api:recovered-0.13-r3
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicare}:${POSTGRES_PASSWORD:-local-dev-postgres-change-me}@postgres:5432/${POSTGRES_DB:-medicare}
      DEPLOYMENT_COUNTRY: ${DEPLOYMENT_COUNTRY:-DE}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Berlin}
      APP_VERSION: ${APP_VERSION:-0.13.0}
      API_PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://host.docker.internal:8080/realms/medicare}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/medicare/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-medicare-api}
      REQUIRE_PRIVILEGED_MFA: ${REQUIRE_PRIVILEGED_MFA:-false}
      PRIVILEGED_MFA_METHODS: ${PRIVILEGED_MFA_METHODS:-mfa,otp,totp,webauthn}
      PRIVILEGED_MFA_ACR_VALUES: ${PRIVILEGED_MFA_ACR_VALUES:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_READ_MAX: ${RATE_LIMIT_READ_MAX:-240}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-60}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      S3_REGION: ${S3_REGION:-local}
      S3_BUCKET_MEDICAL: ${S3_BUCKET_MEDICAL:-medical-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-medicare-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-dev-minio-app-change-me}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-livekit}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      VIDEO_TOKEN_TTL_SECONDS: ${VIDEO_TOKEN_TTL_SECONDS:-900}
      VIDEO_JOIN_EARLY_MINUTES: ${VIDEO_JOIN_EARLY_MINUTES:-15}
      VIDEO_JOIN_AFTER_START_MINUTES: ${VIDEO_JOIN_AFTER_START_MINUTES:-120}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_SCAN_TIMEOUT_MS: ${CLAMAV_SCAN_TIMEOUT_MS:-90000}
      CLAMAV_MAX_STREAM_BYTES: ${CLAMAV_MAX_STREAM_BYTES:-26214400}
      DOCUMENT_SCAN_PROVIDER: ${DOCUMENT_SCAN_PROVIDER:-clamav}
      DOCUMENT_SCAN_WORKER_ENABLED: ${DOCUMENT_SCAN_WORKER_ENABLED:-true}
      DOCUMENT_SCAN_BATCH_SIZE: ${DOCUMENT_SCAN_BATCH_SIZE:-10}
      DOCUMENT_SCAN_MAX_ATTEMPTS: ${DOCUMENT_SCAN_MAX_ATTEMPTS:-5}
      DOCUMENT_SCAN_CLAIM_TTL_SECONDS: ${DOCUMENT_SCAN_CLAIM_TTL_SECONDS:-180}
      DOCUMENT_SCAN_POLL_INTERVAL_MS: ${DOCUMENT_SCAN_POLL_INTERVAL_MS:-5000}
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_CLAIM_TTL_SECONDS: ${OUTBOX_CLAIM_TTL_SECONDS:-120}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-5000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-development}
      PAYMENT_DEV_WEBHOOK_SECRET: ${PAYMENT_DEV_WEBHOOK_SECRET:-local-dev-payment-webhook-secret}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-development}
      NOTIFICATION_DELIVERY_WORKER_ENABLED: ${NOTIFICATION_DELIVERY_WORKER_ENABLED:-false}
      NOTIFICATION_DELIVERY_BATCH_SIZE: ${NOTIFICATION_DELIVERY_BATCH_SIZE:-20}
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-8}
      NOTIFICATION_DELIVERY_CLAIM_TTL_SECONDS: ${NOTIFICATION_DELIVERY_CLAIM_TTL_SECONDS:-120}
      NOTIFICATION_DELIVERY_POLL_INTERVAL_MS: ${NOTIFICATION_DELIVERY_POLL_INTERVAL_MS:-5000}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend, media]

  web:
    image: medicare/web:recovered-0.13-r3
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-0.13.0}
      MEDICARE_API_URL: ${MEDICARE_API_URL:-http://api:4000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_URL: http://localhost:${WEB_PORT:-3000}
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-nextauth-secret-change-me-32chars-minimum}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-medicare-web}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-local-dev-medicare-web-secret}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:-http://host.docker.internal:8080/realms/medicare}
      AUTH_KEYCLOAK_AUTHORIZATION_URL: ${AUTH_KEYCLOAK_AUTHORIZATION_URL:-http://localhost:8080/realms/medicare/protocol/openid-connect/auth}
      AUTH_KEYCLOAK_TOKEN_URL: ${AUTH_KEYCLOAK_TOKEN_URL:-http://keycloak:8080/realms/medicare/protocol/openid-connect/token}
      AUTH_KEYCLOAK_USERINFO_URL: ${AUTH_KEYCLOAK_USERINFO_URL:-http://keycloak:8080/realms/medicare/protocol/openid-connect/userinfo}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backend]

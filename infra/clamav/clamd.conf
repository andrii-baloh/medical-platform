# MediCare local/dev ClamAV daemon configuration.
# Production should be tuned and monitored for the target host capacity.

Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0

LogTime yes
LogClean no
LogSyslog no

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

# Application upload limit is 25 MiB; keep scanner margin above that.
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 40M
MaxRecursion 16
MaxFiles 10000

# Conservative defaults for archives and executable detection.
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanMail no
DetectPUA no

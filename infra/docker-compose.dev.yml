services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medicare
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: medicare
    ports: ["5432:5432"]
    volumes:
      - medicare_pg:/var/lib/postgresql/data
      - ../db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ../db/migrations/002_doctor_workspace.sql:/docker-entrypoint-initdb.d/002_doctor_workspace.sql:ro
      - ../db/migrations/003_video_notifications.sql:/docker-entrypoint-initdb.d/003_video_notifications.sql:ro
      - ../db/migrations/004_outbox_claiming.sql:/docker-entrypoint-initdb.d/004_outbox_claiming.sql:ro
      - ../db/migrations/005_payments_admin.sql:/docker-entrypoint-initdb.d/005_payments_admin.sql:ro
      - ../db/dev/999_dev_doctor_seed.sql:/docker-entrypoint-initdb.d/999_dev_doctor_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare -d medicare"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/medicare HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - medicare_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123456; do sleep 2; done;
      mc mb --ignore-existing local/medical-documents;
      mc anonymous set none local/medical-documents;
      exit 0;
      "

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/livekit.yaml", "--node-ip", "127.0.0.1"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit/livekit.yaml:/livekit.yaml:ro

volumes:
  medicare_pg:
  medicare_minio:
